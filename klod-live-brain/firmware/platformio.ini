; KLOD Live Brain — firmware Teensy 4.1
; ⚠️ Squelette de référence : NON compilé / NON flashé / NON mesuré dans ce dépôt.
;
; Build (avec le matériel) :
;   pio run                 # nécessite PlatformIO + la plateforme "teensy"
; ou Arduino IDE + Teensyduino : carte "Teensy 4.1", USB Type "Serial + MIDI".
;
; Le test natif de la file (test/test_event_queue.cpp) NE passe PAS par pio —
; c'est de la logique pure, compilée par le compilateur de l'hôte :
;   c++ -std=c++17 -Isrc -Wall -Wextra test/test_event_queue.cpp -o /tmp/tq && /tmp/tq

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -std=gnu++17

lib_deps =
    fortyseveneffects/MIDI Library   ; DIN (UART), licence MIT — ÉPINGLER la version au 1er build

; Notes :
;   * USBHost_t36 est fourni avec Teensyduino (pas un lib_deps séparé).
;   * Régler "USB Type" sur MIDI ou Serial+MIDI pour exposer usbMIDI + le port
;     série de diagnostic.
